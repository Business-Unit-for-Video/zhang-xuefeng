name: Secret organization migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECRET_MIGRATION_GITHUB_TOKEN }}
      SOURCE_BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIES }}
    steps:
      - name: Migrate source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$SOURCE_BILIBILI_COOKIE"

          printf '%s' "$SOURCE_BILIBILI_COOKIE" |
            gh secret set BILIBILI_SOURCE_COOKIE_FILE_ZHANG_XUEFENG \
              --org Business-Unit-for-Video \
              --repos zhang-xuefeng
