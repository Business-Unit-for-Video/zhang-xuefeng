name: Secret migration audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit secret metadata
        shell: bash
        env:
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
          BILIBILI_SOURCE_COOKIE_FILE_ZHANG_XUEFENG: ${{ secrets.BILIBILI_SOURCE_COOKIE_FILE_ZHANG_XUEFENG }}
        run: |
          set -euo pipefail

          audit() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "$name present=false"
              return
            fi

            local bytes digest valid
            bytes="$(printf '%s' "$value" | wc -c | tr -d ' ')"
            digest="$(printf '%s' "$value" | sha256sum | cut -c1-16)"
            valid=false
            if [[ "$value" == *$'\t'* ]]; then
              valid=true
            fi
            echo "$name present=true bytes=$bytes sha256_16=$digest format=netscape valid=$valid"
          }

          audit BILIBILI_COOKIES "${BILIBILI_COOKIES:-}"
          audit BILIBILI_SOURCE_COOKIE_FILE_ZHANG_XUEFENG "${BILIBILI_SOURCE_COOKIE_FILE_ZHANG_XUEFENG:-}"

          [[ "$BILIBILI_COOKIES" == "$BILIBILI_SOURCE_COOKIE_FILE_ZHANG_XUEFENG" ]] && echo "bilibili_migration_match=true" || echo "bilibili_migration_match=false"
